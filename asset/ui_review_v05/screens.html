<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>루미아 · 전체화면 시안 17장</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#eee5d5;color:#423a2c;font-family:'Malgun Gothic',sans-serif}header{position:sticky;top:0;z-index:2;background:#f8f2e7ee;border-bottom:2px solid #b99552;padding:18px clamp(18px,4vw,70px);display:flex;gap:24px;align-items:center;justify-content:space-between}h1{font-size:24px;margin:0}header a,.card a{color:#3d4b34}main{max-width:1800px;margin:auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(510px,1fr));gap:24px}.card{background:#fff8ec;border:1px solid #b99c64;border-radius:12px;padding:12px;box-shadow:0 8px 24px #6c53331c}.card img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#241e17;display:block}.card h2{margin:12px 4px 5px;font-size:18px}.card p{margin:0 4px 12px;color:#766549}.card nav{display:flex;gap:18px;margin:0 4px 8px}@media(max-width:560px){main{grid-template-columns:1fr}}
</style></head><body><header><h1>루미아 · 전체화면 시안 17장</h1><a href="index.html">조작 가능한 화면으로 돌아가기</a></header><main id="gallery"></main><script>
const names=['32인 통합 캐릭터 선택 · 전체','32인 통합 캐릭터 선택 · 남자','32인 통합 캐릭터 선택 · 여자','보이는 스탯 6종 · 체력 100','보이는 스탯 6종 · 저체력','백팩 · 아이템과 배지','백팩 · 5개 배지 분류','백팩 · 펫','백팩 · 배경 퍼즐','다이어리 · 주별 활동','다이어리 · 주간 요약','다이어리 · 이야기와 만남','다이어리 · 엔딩 편지','월~금 일정','캐릭터 카드 이름칸 비교','마이룸 안 2 · 창가 독서실','마이룸 안 3 · 룬 연구실'];
gallery.innerHTML=names.map((n,i)=>{const no=String(i+1).padStart(2,'0'),p=`screens/${no}-screen.png`;return `<article class="card"><a href="${p}" target="_blank"><img src="${p}" alt="${n} 전체화면" loading="lazy"></a><h2>${no} · ${n}</h2><p>1920 × 1080 PNG</p><nav><a href="index.html#${i+1}">조작 화면</a><a href="${p}" target="_blank">이미지 크게 보기</a></nav></article>`}).join('');
</script></body></html>
