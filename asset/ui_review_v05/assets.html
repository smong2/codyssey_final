<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>루미아 · 프레임과 배경 에셋</title><style>*{box-sizing:border-box}body{margin:0;background:#eee5d5;color:#423a2c;font-family:'Malgun Gothic',sans-serif}header{background:#f8f2e7;border-bottom:2px solid #b99552;padding:20px 4%;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}a{color:#3d4b34}main{padding:28px 4%;max-width:1700px;margin:auto}section{margin:0 0 40px}h2{border-bottom:1px solid #b99552;padding-bottom:10px}ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;list-style:none;padding:0}li{background:#fff8ec;border:1px solid #b99c64;border-radius:10px;padding:10px}img{display:block;width:100%;height:220px;object-fit:contain;background:repeating-conic-gradient(#ece5d7 0% 25%,#f9f5ec 0% 50%) 50%/18px 18px}figcaption{padding:8px 0;font-size:14px;overflow-wrap:anywhere}</style></head><body><header><h1>루미아 · 프레임과 배경 에셋</h1><a href="index.html">시안으로 돌아가기</a></header><main id="main"></main><script>
const groups=[['핵심 빈 프레임',['card_green_000.png','card_01.png','card_02.png','panel_01.png','panel_02.png','panel_03.png','dialogue_01_original.png','dialogue_02_lighter.png']],['날짜 프레임 3컬러',['date_01_original.png','date_02_soft.png','date_03_pastel.png']],['버튼 프레임',['button_01_primary.png','button_light_001.png','button_02_secondary.png','button_03_compact.png']],['스탯·컬렉션·다이어리·결과',['stat_01_classic.png','stat_02_minimal.png','stat_03_tabs.png','stat_04_dashboard.png','stat_05_vertical.png','collection_01_integrated.png','diary_01_book.png','diary_02_chronology.png','diary_03_bookmarks.png','diary_04_letters.png','diary_05_archive.png','weekly_01_planner.png','result_01_medallion.png','result_02_summary.png','result_03_ribbon.png','result_04_growth.png','result_05_three_cards.png']],['마이룸 배경',['room.png','myroom_02_reading.png','myroom_03_rune.png']]];
main.innerHTML=groups.map(([name,files])=>`<section><h2>${name}</h2><ul>${files.map(f=>`<li><a href="assets/${f}" target="_blank"><img src="assets/${f}" alt="${f}" loading="lazy"></a><figcaption>${f}</figcaption></li>`).join('')}</ul></section>`).join('');
</script></body></html>
