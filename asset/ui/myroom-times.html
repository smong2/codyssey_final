<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>루미아 마이룸 · 낮·노을·밤 비교</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee5d5;color:#423a2c;font-family:'Malgun Gothic',sans-serif}header{background:#f8f2e7;border-bottom:2px solid #b99552;padding:20px 4%;display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:24px;margin:0}a{color:#3d4b34}main{max-width:1920px;margin:auto;padding:25px 3%}h2{margin:30px 0 12px;font-size:21px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:#fff8ec;border:1px solid #b99c64;border-radius:12px;padding:10px}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.card h3{margin:10px 0 3px;font-size:18px}.card p{margin:0 0 10px;color:#766549}.links{display:flex;gap:15px;margin:0 0 5px}@media(max-width:850px){.grid{grid-template-columns:1fr}header{flex-wrap:wrap}}
</style></head><body><header><h1>마이룸 두 안 · 낮 / 노을 / 밤</h1><nav><a href="screens.html">전체화면 21장</a>　<a href="index.html">조작 가능한 시안</a></nav></header><main id="main"></main><script src="manifest.js"></script><script>
const rooms=[['안 2 · 창가 독서실',[[16,'낮','myroom_02_reading.png','기존 이미지'],[18,'노을','myroom_02_sunset.png','이번에 추가'],[19,'밤','myroom_02_night.png','이번에 추가']]],['안 3 · 룬 연구실',[[20,'낮','myroom_03_day.png','이번에 추가'],[17,'노을','myroom_03_rune.png','기존 이미지'],[21,'밤','myroom_03_night.png','이번에 추가']]]];
main.innerHTML=rooms.map(([name,times])=>`<section><h2>${name}</h2><div class="grid">${times.map(([no,time,raw,status])=>{const screen=`/shared/Full%20screen/${no}-screen.png`;return `<article class="card"><a href="${screen}" target="_blank"><img src="${screen}" alt="${name} ${time} 전체화면"></a><h3>${time}</h3><p>${status}</p><div class="links"><a href="${screen}" target="_blank">게임 화면 크게 보기</a><a href="${assetUrl(raw)}" target="_blank">UI 없는 배경 원본</a></div></article>`}).join('')}</div></section>`).join('');
</script></body></html>
