<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>카엘 8방향 검수</title><style>body{font:16px sans-serif;background:#f4eedf;color:#343b3c;padding:24px}button,select{font:inherit;padding:8px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}article{border:1px solid #b4ab93;padding:12px;border-radius:12px}img{width:128px;height:128px;background:repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 0/16px 16px}.dark img{background:#253640}.small img{width:64px;height:64px}p{max-width:900px;line-height:1.6}</style><h1>카엘 8방향 검수</h1><p>방향별 3프레임을 256×256로 분리했습니다. 이전 시트는 보존했습니다. 이 페이지는 게임용 승인본이 아닌 움직임 검수용입니다. 후면 책 위치 변화, 일부 방향의 유사 보폭, 방향 간 머리·몸통 비율을 확인해야 합니다.</p><button id="play">일시정지</button> <button onclick="document.body.classList.toggle('dark')">배경 바꾸기</button> <button onclick="document.body.classList.toggle('small')">64px / 128px</button><main></main><script>const dirs=['S','SW','W','NW','N','NE','E','SE'],names=['정면','좌전방','좌측','좌후방','후면','우후방','우측','우전방'];const main=document.querySelector('main');dirs.forEach((d,i)=>{const a=document.createElement('article');a.innerHTML='<h2>'+names[i]+' · '+d+'</h2><img alt="'+names[i]+' 카엘">';main.append(a)});let playing=true,t=0;document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'일시정지':'재생'};function draw(){document.querySelectorAll('img').forEach((im,i)=>im.src='16_images/01_SD03_frames/SD03_'+dirs[i]+'_'+String([0,1,2,1][t%4]).padStart(2,'0')+'.png')}draw();setInterval(()=>{if(playing){t++;draw()}},160)</script></html>
